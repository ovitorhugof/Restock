<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos | Recanto Sabor de Minas</title>
  <link rel="icon" type="image/png" href="assets/icone-favicon.png"><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand-lockup" href="dashboard.html"><img class="brand-logo" src="assets/icone-favicon.png" alt="Recanto Sabor de Minas"><span><span class="brand-name">Recanto Sabor de Minas</span><span class="brand-subtitle">Controle de estoque</span></span></a>
      <nav aria-label="Navegação principal"><a href="dashboard.html">Visão geral</a><a class="ativo" href="produtos.html">Produtos</a><a href="movimentacoes.html">Movimentar estoque</a><a href="historico.html">Histórico</a><a href="http://127.0.0.1:3030/terminal" target="_blank" rel="noopener">Terminal de mesas ↗</a></nav>
      <button class="sair" type="button" onclick="sair()">Encerrar acesso</button>
    </aside>
    <main class="conteudo">
      <header class="topo-pagina"><div><h1>Produtos</h1><p>Cadastre itens e acompanhe o saldo disponível.</p></div><div class="usuario" id="nome-usuario"></div></header>
      <section class="painel"><div class="barra-acoes"><input id="busca" class="campo-busca" placeholder="Buscar produto ou categoria" aria-label="Buscar produtos"><button class="btn btn-principal" id="novo-produto" type="button">Novo produto</button></div><p id="mensagem-produto" class="mensagem" aria-live="polite"></p><div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Unidade</th><th>Quantidade</th><th>Mínimo</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="lista-produtos"></tbody></table></div></section>
    </main>
  </div>
  <div class="modal escondido" id="modal-produto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal"><div class="modal-caixa"><div class="modal-topo"><h2 id="titulo-modal">Novo produto</h2><button class="fechar" id="fechar-modal" type="button" aria-label="Fechar">×</button></div><form id="form-produto"><input type="hidden" id="produto-id"><label for="produto-nome">Nome <span class="required">*</span></label><input id="produto-nome" maxlength="80" required><label for="produto-categoria">Categoria <span class="required">*</span></label><input id="produto-categoria" maxlength="60" required><div class="linha-form"><div><label for="produto-unidade">Unidade <span class="required">*</span></label><select id="produto-unidade" required><option value="">Selecione</option><option value="kg">kg</option><option value="L">L</option><option value="un">un</option></select></div><div><label for="produto-quantidade">Quantidade <span class="required">*</span></label><input id="produto-quantidade" type="number" min="0" step="0.01" required></div></div><label for="produto-minimo">Estoque mínimo <span class="required">*</span></label><input id="produto-minimo" type="number" min="0" step="0.01" required><p id="erro-form-produto" class="mensagem erro" aria-live="polite"></p><div class="acoes-form"><button type="button" class="btn btn-secundario" id="cancelar-modal">Cancelar</button><button class="btn btn-principal" type="submit">Salvar produto</button></div></form></div></div>
  <script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/produtos.js"></script>
</body>
</html>
