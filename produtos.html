<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Restock | Produtos</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-layout"><aside class="sidebar"><a class="logo" href="dashboard.html"><span>R</span> Restock</a><nav><a href="dashboard.html">Dashboard</a><a class="ativo" href="produtos.html">Produtos</a><a href="movimentacoes.html">Movimentações</a><a href="historico.html">Histórico</a></nav><button class="sair" onclick="sair()">Sair</button></aside>
<main class="conteudo"><header><div><h1>Produtos</h1><p>Cadastre e acompanhe os itens do estoque.</p></div><div class="usuario" id="nome-usuario"></div></header>
<section class="painel"><div class="barra-acoes"><input id="busca" class="campo-busca" placeholder="Buscar por nome ou categoria"><button class="btn btn-principal" id="novo-produto">Novo produto</button></div><p id="mensagem-produto" class="mensagem" aria-live="polite"></p><div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Unidade</th><th>Quantidade</th><th>Estoque mínimo</th><th>Ações</th></tr></thead><tbody id="lista-produtos"></tbody></table></div></section></main></div>
<div class="modal escondido" id="modal-produto"><div class="modal-caixa"><div class="modal-topo"><h2 id="titulo-modal">Novo produto</h2><button class="fechar" id="fechar-modal" aria-label="Fechar">×</button></div><form id="form-produto"><input type="hidden" id="produto-id"><label for="produto-nome">Nome</label><input id="produto-nome" required><label for="produto-categoria">Categoria</label><input id="produto-categoria" required><div class="linha-form"><div><label for="produto-unidade">Unidade</label><select id="produto-unidade" required><option value="">Selecione</option><option>kg</option><option>L</option><option>un</option></select></div><div><label for="produto-quantidade">Quantidade</label><input id="produto-quantidade" type="number" min="0" step="0.01" required></div></div><label for="produto-minimo">Estoque mínimo</label><input id="produto-minimo" type="number" min="0" step="0.01" required><p id="erro-form-produto" class="mensagem erro"></p><div class="acoes-form"><button type="button" class="btn btn-secundario" id="cancelar-modal">Cancelar</button><button class="btn btn-principal">Salvar</button></div></form></div></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/produtos.js"></script></body></html>
