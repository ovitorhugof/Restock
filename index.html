<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recanto Sabor de Minas | Estoque</title>
  <link rel="icon" type="image/png" href="assets/icone-favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <div class="brand-lockup"><img class="brand-logo" src="assets/logo-recanto-completo.png" alt="Recanto Sabor de Minas"></div>
    <h1>Controle de estoque</h1>
    <p>Informe seus dados para acessar o controle de estoque.</p>
    <form id="login-form" novalidate>
      <label for="nome">Seu nome <span class="required">*</span></label>
      <input id="nome" autocomplete="name" maxlength="60" placeholder="Ex.: Maria" required autofocus>
      <label for="senha">Senha <span class="required">*</span></label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <p id="mensagem-login" class="mensagem erro" aria-live="polite"></p>
      <button type="submit" class="btn btn-principal btn-largo">Acessar estoque</button>
    </form>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
