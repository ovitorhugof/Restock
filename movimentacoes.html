<body>
  <div class="app-layout">
    <aside class="sidebar"><a class="brand-lockup" href="dashboard.html"><img class="brand-logo" src="assets/icone-favicon.png" alt="Recanto Sabor de Minas"><span><span class="brand-name">Recanto Sabor de Minas</span><span class="brand-subtitle">Controle de estoque</span></span></a><nav aria-label="Navegação principal"><a href="dashboard.html">Visão geral</a><a href="produtos.html">Produtos</a><a class="ativo" href="movimentacoes.html">Movimentar estoque</a><a href="historico.html">Histórico</a><a href="http://127.0.0.1:3030/terminal" target="_blank" rel="noopener">Terminal de mesas ↗</a></nav><button class="sair" type="button" onclick="sair()">Encerrar acesso</button></aside>
    <main class="conteudo"><header class="topo-pagina"><div><h1>Movimentar estoque</h1><p>Registre compras, reposições e consumo.</p></div><div class="usuario" id="nome-usuario"></div></header><section class="painel formulario-painel"><h2>Nova movimentação</h2><p class="ajuda-form">A saída é bloqueada quando a quantidade ultrapassa o saldo disponível.</p><form id="form-movimentacao"><div class="linha-form"><div><label for="mov-produto">Produto <span class="required">*</span></label><select id="mov-produto" required></select></div><div><label for="mov-tipo">Tipo <span class="required">*</span></label><select id="mov-tipo" required><option value="Entrada">Entrada</option><option value="Saída">Saída</option></select></div></div><div id="info-estoque" class="info-estoque" aria-live="polite"></div><label for="mov-quantidade">Quantidade <span class="required">*</span></label><input id="mov-quantidade" type="number" min="0.01" step="0.01" required><label for="mov-observacao">Observação</label><textarea id="mov-observacao" rows="3" maxlength="180" placeholder="Ex.: compra do fornecedor"></textarea><p id="mensagem-movimentacao" class="mensagem" aria-live="polite"></p><div class="acoes-form"><button type="reset" class="btn btn-secundario">Limpar</button><button id="registrar-movimentacao" class="btn btn-principal" type="submit">Registrar</button></div></form></section></main>
  </div>
  <script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/movimentacoes.js"></script>
